# Evenly — self-hosted on your machine.
#   docker compose up -d --build     → http://localhost:3000
# Containers restart automatically (also after a reboot, once Docker starts),
# and your data lives in the "evenly-db" volume, so it survives restarts and
# image rebuilds. See README → "Run it on localhost" for backups.
name: evenly

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: evenly
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-evenly}
      POSTGRES_DB: evenly
    volumes:
      - evenly-db:/var/lib/postgresql/data
    # Published on 5433 (localhost only) so `npm run dev` and DB tools can
    # connect without clashing with a Postgres you may already run on 5432.
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evenly -d evenly"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Applies any pending migrations, then exits. Runs on every `up`.
  migrate:
    build:
      context: .
      target: migrate
    environment:
      DATABASE_URL: postgresql://evenly:${POSTGRES_PASSWORD:-evenly}@db:5432/evenly
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://evenly:${POSTGRES_PASSWORD:-evenly}@db:5432/evenly
      # Decides when recurring expenses post and what "today" is.
      TZ: ${TZ:-Asia/Kolkata}
    ports:
      # Reachable at http://localhost:3000, and from phones/laptops on your
      # Wi-Fi at http://<this-computer's-IP>:3000. Use "127.0.0.1:3000:3000"
      # to keep it to this computer only.
      - "${EVENLY_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  evenly-db:
